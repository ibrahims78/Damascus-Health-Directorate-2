      parameters:
        - { name: sessionId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Relay package metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JsonObject"
    post:
      operationId: uploadRelayPackage
      tags: [sync]
      summary: Store an opaque encrypted relay package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "201":
          description: Relay package metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonObject"

  /sync/relay/packages/{relayId}:
    get:
      operationId: downloadRelayPackage
      tags: [sync]
      summary: Download opaque relay bytes when requested
      parameters:
        - { name: relayId, in: path, required: true, schema: { type: string } }
        - { name: download, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: Relay package metadata or encrypted bytes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonObject"

  /sync/relay/expired:
    delete:
      operationId: purgeExpiredRelayPackages
      tags: [sync]
      summary: Purge expired relay packages
      responses:
        "200":
          description: Purge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonObject"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    SetupStatus:
      type: object
      required: [needsSetup]
      properties:
        needsSetup:
          type: boolean

    SetupAdminInput:
      type: object
      required: [username, password, fullName]
      properties:
        username:
          type: string
        password:
          type: string
        fullName:
          type: string

    LoginCredentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthUser:
      type: object
      required: [id, username, fullName, role]
      properties:
        id:
          type: integer
        username:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [admin, warehouse_manager, viewer]
        mustChangePassword:
          type: boolean
        csrfToken:
          type: string
          nullable: true

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string

    User:
      type: object
      required: [id, username, fullName, role, isActive, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [admin, warehouse_manager, viewer]
        isActive:
          type: boolean
        createdAt:
          type: string

    UserInput:
      type: object
      required: [username, password, fullName, role]
      properties:
        username:
          type: string
        password:
          type: string
        fullName:
          type: string
        role:
          type: string

    UserUpdate:
      type: object
      properties:
        fullName:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
        isActive:
          type: ["boolean", "null"]
        password:
          type: ["string", "null"]

    Category:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string

    Item:
      type: object
      required: [id, name, unit, itemType, currentStock, minStock, isActive, createdAt]
      properties:
        id:
          type: integer
        code:
          type: ["string", "null"]
        name:
          type: string
        categoryId:
          type: ["integer", "null"]
        categoryName:
          type: ["string", "null"]
        itemType:
          type: string
        unit:
          type: string
        currentStock:
          type: integer
        minStock:
          type: integer
        expiryDate:
          type: ["string", "null"]
        batchNumber:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        supplier:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    StagnantItem:
      type: object
      required:
        - id
        - name
        - unit
        - itemType
        - currentStock
        - minStock
        - createdAt
        - idleDays
      properties:
        id: { type: integer }
        code: { type: ["string", "null"] }
        name: { type: string }
        categoryName: { type: ["string", "null"] }
        itemType: { type: string }
        unit: { type: string }
        currentStock: { type: integer }
        minStock: { type: integer }
        location: { type: ["string", "null"] }
        supplier: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        lastMovementAt: { type: ["string", "null"], format: date-time }
        idleDays: { type: integer }

    StagnantItemsReport:
      type: object
      required: [staleMonths, cutoffDate, items]
      properties:
        staleMonths: { type: integer }
        cutoffDate: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: "#/components/schemas/StagnantItem"

    ItemInput:
      type: object
      required: [name, unit, itemType]
      properties:
        code:
          type: ["string", "null"]
        name:
          type: string
        categoryId:
          type: ["integer", "null"]
        itemType:
          type: string
        unit:
          type: string
        currentStock:
          type: integer
        minStock:
          type: integer
        expiryDate:
          type: ["string", "null"]
        batchNumber:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        supplier:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    ItemUpdate:
      type: object
      properties:
        code:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
        categoryId:
          type: ["integer", "null"]
        itemType:
          type: ["string", "null"]
        unit:
          type: ["string", "null"]
        minStock:
          type: ["integer", "null"]
        expiryDate:
          type: ["string", "null"]
        batchNumber:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        supplier:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        isActive:
          type: ["boolean", "null"]

    ItemListResponse:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    ItemHistoryBatch:
      type: object
      required: [id, receivedQuantity, remainingQuantity]
      properties:
        id: { type: integer }
        batchNumber: { type: ["string", "null"] }
        receivedQuantity: { type: integer }
        remainingQuantity: { type: integer }
        expiryDate: { type: ["string", "null"] }
        deliveryNoteNumber: { type: ["string", "null"] }
        deliveryNoteDate: { type: ["string", "null"] }
        createdAt: { type: string }

    ItemHistoryAllocation:
      type: object
      required: [batchId, quantity]
      properties:
        batchId: { type: integer }
        quantity: { type: integer }
        batchNumber: { type: ["string", "null"] }
        expiryDate: { type: ["string", "null"] }

    ItemHistoryMovement:
      type: object
      required: [id, type, documentNumber, quantity, allocations, isHistoricalIncomplete]
      properties:
        id: { type: integer }
        type:
          type: string
          enum: [in, out, adjust, custody_out, custody_return, damage, central_return]
        quantity: { type: ["integer", "null"] }
        partyName: { type: ["string", "null"] }
        documentNumber: { type: string }
        documentDate: { type: ["string", "null"] }
        createdAt: { type: string }
        operatorName: { type: ["string", "null"] }
        expiryDate: { type: ["string", "null"] }
        batchNumber: { type: ["string", "null"] }
        reason: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        isHistoricalIncomplete: { type: boolean }
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/ItemHistoryAllocation"

    ItemHistoryResponse:
      type: object
      required: [item, batches, movements, total, page, limit]
      properties:
        item:
          $ref: "#/components/schemas/Item"
        batches:
          type: array
          items:
            $ref: "#/components/schemas/ItemHistoryBatch"
        movements:
          type: array
          items:
            $ref: "#/components/schemas/ItemHistoryMovement"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    Equipment:
      type: object
      required: [id, name, condition, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        equipmentType:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        serialNumber:
          type: ["string", "null"]
        condition:
          type: string
          enum: [good, maintenance, broken, consumed, needs_inspection]
        manufactureYear:
          type: ["integer", "null"]
        originCountry:
          type: ["string", "null"]
        currentHolder:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        quantity:
          type: integer
          default: 1
        minQuantity:
          type: integer
