openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Ambulance & Emergency Warehouse Management System API — Damascus
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: categories
  - name: items
  - name: equipment
  - name: transactions
  - name: recipients
  - name: exit-reasons
  - name: dashboard
  - name: alerts
  - name: reports
  - name: users

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCredentials"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/setup-status:
    get:
      operationId: getSetupStatus
      tags: [auth]
      summary: Check if initial admin setup is needed
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"

  /auth/setup:
    post:
      operationId: setupAdmin
      tags: [auth]
      summary: Create the first admin account (only works if no admin exists)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupAdminInput"
      responses:
        "200":
          description: Admin created and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "409":
          description: Admin already exists

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /items:
    get:
      operationId: listItems
      tags: [items]
      summary: List items with optional filters
      parameters:
        - name: categoryId
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
        - name: belowMin
          in: query
          schema: { type: boolean }
        - name: nearExpiry
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000 }
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, currentStock, minStock, expiryDate, createdAt]
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Paginated list of items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemListResponse"
    post:
      operationId: createItem
      tags: [items]
      summary: Create a new item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"

  /items/{id}:
    get:
      operationId: getItem
      tags: [items]
      summary: Get item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Not found
    put:
      operationId: updateItem
      tags: [items]
      summary: Update item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
    delete:
      operationId: deleteItem
      tags: [items]
      summary: Deactivate item (soft delete)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deactivated

  /items/history:
    get:
      operationId: getItemHistory
      tags: [items]
      summary: Get an item card with its paginated chronological movement history
      parameters:
        - name: itemId
          in: query
          required: true
          schema: { type: integer }
        - name: type
          in: query
          schema:
            type: string
            enum: [in, init, out, adjust, custody_out, custody_return, damage, central_return]
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: document
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Item details, batches, and chronological movement history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemHistoryResponse"
        "400":
          description: Invalid filter
        "404":
          description: Item not found

  /equipment:
    get:
      operationId: listEquipment
      tags: [equipment]
      summary: List equipment with optional filters
      parameters:
        - name: condition
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000 }
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, condition, quantity, manufactureYear, createdAt]
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Paginated list of equipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentListResponse"
    post:
      operationId: createEquipment
      tags: [equipment]
      summary: Create new equipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentInput"
      responses:
        "201":
          description: Created equipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"

  /equipment/{id}:
    get:
      operationId: getEquipment
      tags: [equipment]
      summary: Get equipment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Equipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"
        "404":
          description: Not found
    put:
      operationId: updateEquipment
      tags: [equipment]
      summary: Update equipment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentUpdate"
      responses:
        "200":
          description: Updated equipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"
    delete:
      operationId: deleteEquipment
      tags: [equipment]
      summary: Delete equipment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /equipment/{id}/history:
    get:
      operationId: getEquipmentCardHistory
      tags: [equipment]
      summary: Get an equipment card with linked custodies and movement history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: type
          in: query
          schema:
            type: string
            enum: [in, init, out, adjust, custody_out, custody_return, damage, central_return]
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: document
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Equipment card, related custodies, and chronological history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentHistoryResponse"
        "404":
          description: Not found

  /items/fefo-preview:
    get:
      operationId: getItemFefoPreview
      tags: [items]
      summary: Preview FEFO allocations for a consumable item
      parameters:
        - name: itemId
          in: query
          required: true
          schema: { type: integer }
        - name: quantity
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: FEFO allocation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FefoPreview"
        "400":
          description: Invalid quantity or non-consumable item
        "404":
          description: Item not found

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List transactions with optional filters
      parameters:
        - name: type
          in: query
          schema: { type: string }
        - name: itemType
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Paginated list of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"

  /transactions/in:
    post:
      operationId: createInTransaction
      tags: [transactions]
      summary: Record an inbound transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InTransactionInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/out:
    post:
      operationId: createOutTransaction
      tags: [transactions]
      summary: Record an outbound transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutTransactionInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/adjust:
    post:
      operationId: createInventoryAdjustment
      tags: [transactions]
      summary: Reconcile an item stock balance with an audited adjustment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentInput"
      responses:
        "201":
          description: Created adjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/custody-out:
    post:
      operationId: createCustodyOutTransaction
      tags: [transactions]
      summary: Assign equipment to personal custody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustodyOutInput"
      responses:
        "201":
          description: Created custody movement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/custody-return:
    post:
      operationId: createCustodyReturnTransaction
      tags: [transactions]
      summary: Return equipment from personal custody
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustodyReturnInput"
      responses:
        "201":
          description: Created custody return
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/damage:
    post:
      operationId: createDamageTransaction
      tags: [transactions]
      summary: Record damaged stock as an audited movement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DamageInput"
      responses:
        "201":
          description: Created damage movement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/central-return:
    post:
      operationId: createCentralReturnTransaction
      tags: [transactions]
      summary: Return stock to the central warehouse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CentralReturnInput"
      responses:
        "201":
          description: Created central return
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /custodies:
    get:
      operationId: listCustodies
      tags: [transactions]
      summary: List personal custody records
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, partially_returned, returned, damaged, closed]
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Personal custody records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustodySummary"

  /custodies/{id}:
    get:
      operationId: getCustodyHistory
      tags: [transactions]
      summary: Get an independent custody card and lifecycle history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Custody card with delivery, return, inspection, and damage history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustodyHistoryResponse"
        "404":
          description: Not found

  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get transaction by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found

  /transactions/{id}/print:
    get:
      operationId: getTransactionPrint
      tags: [transactions]
      summary: Get full transaction data for printing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Print data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPrint"

  /recipients:
    get:
      operationId: listRecipients
      tags: [recipients]
      summary: List recipient organizations
      parameters:
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: List of recipients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recipient"
    post:
      operationId: createRecipient
      tags: [recipients]
      summary: Create a recipient organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipientInput"
      responses:
        "201":
          description: Created recipient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipient"

  /exit-reasons:
    get:
      operationId: listExitReasons
      tags: [exit-reasons]
      summary: List exit reasons
      parameters:
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: List of exit reasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExitReason"
    post:
      operationId: createExitReason
      tags: [exit-reasons]
      summary: Create an exit reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExitReasonInput"
      responses:
        "201":
          description: Created exit reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExitReason"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard KPI statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/charts:
    get:
      operationId: getDashboardCharts
      tags: [dashboard]
      summary: Get chart data for dashboard
      responses:
        "200":
          description: Chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardCharts"

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: Get active alerts (low stock, near expiry, equipment issues)
      responses:
        "200":
          description: Active alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /alerts/read-all:
    post:
      operationId: markAllAlertsRead
      tags: [alerts]
      summary: Mark all unresolved alerts as read for the current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /alerts/refresh:
    post:
      operationId: refreshAlerts
      tags: [alerts]
      summary: Trigger an immediate alert worker run (admin use)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /alerts/{id}/read:
    post:
      operationId: markAlertRead
      tags: [alerts]
      summary: Mark a single alert as read for the current user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /alerts/{id}/resolve:
    post:
      operationId: resolveAlert
      tags: [alerts]
      summary: Manually resolve an alert
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Alert not found or already resolved

  /reports/stock:
    get:
      operationId: getStockReport
      tags: [reports]
      summary: Current stock report for all active items
      responses:
        "200":
          description: Stock report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

  /reports/movements:
    get:
      operationId: getMovementsReport
      tags: [reports]
      summary: Movements report with date range filter
      parameters:
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Movements report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /reports/expiry:
    get:
      operationId: getExpiryReport
      tags: [reports]
      summary: Items near expiry or expired
      responses:
        "200":
          description: Expiry report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

  /reports/near-expiry:
    get:
      operationId: getNearExpiryReport
      tags: [reports]
      summary: Active items nearing expiry, excluding expired items
      responses:
        "200":
          description: Near expiry report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

  /reports/stagnant:
    get:
      operationId: getStagnantItemsReport
      tags: [reports]
      summary: Active stocked items with no movement for more than seven months
      responses:
        "200":
          description: Stagnant items report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StagnantItemsReport"

  /reports/below-min:
    get:
      operationId: getBelowMinReport
      tags: [reports]
      summary: Items below minimum stock level
      responses:
        "200":
          description: Below min report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

  /reports/equipment:
    get:
      operationId: getEquipmentReport
      tags: [reports]
      summary: Equipment status report
      responses:
        "200":
          description: Equipment report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Equipment"

  /reports/stock-position:
    get:
      operationId: getStockPositionReport
      tags: [reports]
      summary: Reconciled stock position by ownership and state
      responses:
        "200":
          description: Reconciled stock position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockPositionReport"

  /reports/custodies:
    get:
      operationId: getCustodiesReport
      tags: [reports]
      summary: Open and overdue personal custody report
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, partially_returned, damaged]
        - name: search
          in: query
          schema: { type: string }
        - name: overdueDays
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 3650
      responses:
        "200":
          description: Personal custody report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustodyReport"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get system settings
      responses:
        "200":
          description: System settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update system settings (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSettings"

  /settings/change-password:
