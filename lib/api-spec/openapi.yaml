      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "200":
          description: Conflict decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonObject"

  /sync/relay/packages:
    get:
      operationId: listRelayPackages
